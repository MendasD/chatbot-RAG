version: '3.8'

services:
  web:
    build: .
    command: python noxa_app/base/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=noxa.settings
      - PYTHONPATH=/app:/app/noxa_app/base
    restart: always

volumes:
  sqlite_data:
